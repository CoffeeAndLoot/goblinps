name: Release addon

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Set as a repository secret to publish on Wago; leave unset to skip.
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check TOC version matches tag
        run: |
          set -euo pipefail
          TOC_VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' GoblinPS/GoblinPS.toc | tr -d '\r')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TOC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::TOC version (${TOC_VERSION}) does not match tag (${TAG_VERSION}). Bump GoblinPS.toc before tagging." >&2
            exit 1
          fi

      - name: Build addon zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          cp LICENSE GoblinPS/LICENSE.txt
          zip -qr "GoblinPS-${VERSION}.zip" GoblinPS -x "*.DS_Store"
          unzip -l "GoblinPS-${VERSION}.zip"

      # Commits since the previous tag, as the changelog for every store.
      - name: Write changelog
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## GoblinPS ${GITHUB_REF_NAME#v}"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: GoblinPS-${{ github.ref_name }}.zip
          body_path: CHANGELOG.md

      # Wago Addons. Runs only when the WAGO_API_TOKEN secret exists and the
      # TOC carries an X-Wago-ID, so a fork without either still releases to
      # GitHub. GoblinPS targets WoW Forever, not retail, so the supported
      # patch is read from Wago's own "forever" live-patch list (never the
      # retail one) and sent back as "supported_forever_patches" -- the
      # plural, array-shaped field the BigWigs packager (release.sh) uses for
      # a Forever upload -- so it never needs a hand edit on patch day. A tag
      # containing "beta" or "alpha" publishes at that stability.
      - name: Publish to Wago
        if: env.WAGO_API_TOKEN != ''
        run: |
          set -euo pipefail
          WAGO_ID=$(sed -n 's/^## X-Wago-ID:[[:space:]]*//p' GoblinPS/GoblinPS.toc | tr -d '\r')
          if [ -z "$WAGO_ID" ]; then
            echo "No X-Wago-ID in the TOC; skipping Wago."
            exit 0
          fi

          case "${GITHUB_REF_NAME}" in
            *alpha*) STABILITY=alpha ;;
            *beta*)  STABILITY=beta ;;
            *)       STABILITY=stable ;;
          esac

          PATCH=$(curl -sf -H "Accept: application/json" https://addons.wago.io/api/data/game \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["live_patches"]["supported_forever_patches"])')

          LABEL="${GITHUB_REF_NAME#v}" STABILITY="$STABILITY" PATCH="$PATCH" python3 - > metadata.json <<'PY'
          import json, os
          print(json.dumps({
              "label": os.environ["LABEL"],
              "stability": os.environ["STABILITY"],
              "changelog": open("CHANGELOG.md", encoding="utf-8").read(),
              "supported_forever_patches": [os.environ["PATCH"]],
          }))
          PY

          echo "Uploading to Wago project ${WAGO_ID} for forever ${PATCH} as ${STABILITY}"
          curl -sf -X POST "https://addons.wago.io/api/projects/${WAGO_ID}/version" \
            -H "Authorization: Bearer ${WAGO_API_TOKEN}" \
            -H "Accept: application/json" \
            -F "file=@GoblinPS-${GITHUB_REF_NAME}.zip" \
            -F "metadata=<metadata.json"
          echo
